<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f4f7f6;
    }
    .registration-card {
      border: none;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }
    .form-header {
      background-color: #0d6efd;
      color: white;
      border-radius: 15px 15px 0 0;
      padding: 20px;
      text-align: center;
    }
    .btn-submit {
      border-radius: 8px;
      padding: 10px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        
        <div class="card registration-card">
          <div class="form-header">
            <h3 class="mb-0">Student Registration Form</h3>
            <p class="mb-0 small text-white-50">Please fill out all required fields carefully.</p>
          </div>
          
          <div class="card-body p-4 p-md-5">
            <form action="javascript:alert('Registration Successful!');" method="get">
              
              <!-- Personal Details Row -->
              <h5 class="text-primary border-bottom pb-2 mb-3">Personal Details</h5>
              
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="firstName" class="form-label">First Name</label>
                  <input type="text" class="form-control" id="firstName" placeholder="John" required>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="lastName" class="form-label">Last Name</label>
                  <input type="text" class="form-control" id="lastName" placeholder="Doe" required>
                </div>
              </div>

              <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" placeholder="student@university.edu" required>
              </div>

              <!-- Academic Details Row -->
              <h5 class="text-primary border-bottom pb-2 mb-3 mt-4">Academic Details</h5>
              
              <div class="mb-3">
                <label for="course" class="form-label">Select Course</label>
                <select class="form-select" id="course" required>
                  <option value="" selected disabled>Choose a course...</option>
                  <option value="btech">B.Tech Computer Science</option>
                  <option value="bba">Bachelor of Business Administration</option>
                  <option value="mca">Master of Computer Applications</option>
                </select>
              </div>

              <div class="mb-4">
                <label class="form-label d-block">Gender</label>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="genderOptions" id="male" value="male" required>
                  <label class="form-check-label" for="male">Male</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="genderOptions" id="female" value="female">
                  <label class="form-check-label" for="female">Female</label>
                </div>
              </div>
              
              <div class="mb-4 form-check">
                <input type="checkbox" class="form-check-input" id="terms" required>
                <label class="form-check-label text-muted small" for="terms">I agree to the university terms and conditions.</label>
              </div>
              
              <button type="submit" class="btn btn-primary btn-submit w-100 mb-3">Register Student</button>
            </form>

            <div class="text-center">
              <a href="index.html" class="text-decoration-none text-muted small"><i class="bi bi-arrow-left"></i> Back to Portfolio</a>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>

</body>
</html>
