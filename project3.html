<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List App</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f4f7f6;
    }

    .todo-container {
      background-color: white;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      padding: 30px;
    }

    .task-item {
      transition: all 0.2s ease;
      background-color: #f8f9fa;
      border-radius: 8px;
    }

    .task-item:hover {
      background-color: #e9ecef;
    }

    .completed {
      text-decoration: line-through;
      color: #adb5bd;
    }
  </style>
</head>

<body class="py-5">

  <div class="container">
    <div class="mb-4">
      <a href="index.html" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Back to
        Portfolio</a>
    </div>

    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">

        <div class="todo-container">
          <h2 class="text-primary mb-4 text-center fw-bold">My Tasks</h2>

          <form id="todoForm" class="d-flex gap-2 mb-4">
            <input type="text" id="taskInput" class="form-control" placeholder="Add a new task..." required>
            <button type="submit" class="btn btn-primary px-4">Add</button>
          </form>

          <ul id="taskList" class="list-unstyled mb-0 d-flex flex-column gap-2">
            <!-- Tasks will be added here via JS -->
            <li class="task-item d-flex justify-content-between align-items-center p-3 border">
              <div>
                <input type="checkbox" class="form-check-input me-2" onchange="toggleTask(this)">
                <span>Finish Web Tech Assignment</span>
              </div>
              <button class="btn btn-sm btn-danger" onclick="deleteTask(this)"><i class="bi bi-trash"></i></button>
            </li>
            <li class="task-item d-flex justify-content-between align-items-center p-3 border">
              <div>
                <input type="checkbox" class="form-check-input me-2" checked onchange="toggleTask(this)">
                <span class="completed">Study for midterms</span>
              </div>
              <button class="btn btn-sm btn-danger" onclick="deleteTask(this)"><i class="bi bi-trash"></i></button>
            </li>
          </ul>
        </div>

      </div>
    </div>
  </div>

  <script>
    const todoForm = document.getElementById("todoForm");
    const taskInput = document.getElementById("taskInput");
    const taskList = document.getElementById("taskList");

    todoForm.addEventListener("submit", function (e) {
      e.preventDefault();

      const taskText = taskInput.value.trim();
      if (taskText === "") return;

      // Create new list item
      const li = document.createElement("li");
      li.className = "task-item d-flex justify-content-between align-items-center p-3 border";

      li.innerHTML = `
        <div>
          <input type="checkbox" class="form-check-input me-2" onchange="toggleTask(this)">
          <span>${taskText}</span>
        </div>
        <button class="btn btn-sm btn-danger" onclick="deleteTask(this)"><i class="bi bi-trash"></i></button>
      `;

      // Add to list and clear input
      taskList.appendChild(li);
      taskInput.value = "";
    });

    // Make functions global so inline onclick handlers work
    window.toggleTask = function (checkbox) {
      const span = checkbox.nextElementSibling;
      if (checkbox.checked) {
        span.classList.add("completed");
      } else {
        span.classList.remove("completed");
      }
    };

    window.deleteTask = function (button) {
      const li = button.closest("li");
      li.remove();
    };
  </script>
</body>

</html>
