<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Calculator</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f4f7f6;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .calculator {
      background-color: #212529;
      border-radius: 15px;
      padding: 20px;
      width: 100%;
      max-width: 320px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
    }
    .display {
      background-color: #e9ecef;
      color: #212529;
      border-radius: 10px;
      padding: 15px;
      font-size: 2rem;
      text-align: right;
      margin-bottom: 20px;
      min-height: 70px;
      word-break: break-all;
    }
    .calc-btn {
      height: 60px;
      font-size: 1.2rem;
      border-radius: 10px;
    }
    .back-link {
      position: absolute;
      top: 20px;
      left: 20px;
    }
  </style>
</head>
<body>
  
  <a href="index.html" class="btn btn-light back-link shadow-sm">Back to Portfolio</a>

  <div class="calculator">
    <div class="display" id="display">0</div>
    
    <div class="row g-2">
      <!-- Row 1 -->
      <div class="col-6"><button class="btn btn-danger calc-btn w-100" onclick="clearDisplay()">C</button></div>
      <div class="col-3"><button class="btn btn-warning calc-btn w-100 fw-bold" onclick="appendOperator('/')">÷</button></div>
      <div class="col-3"><button class="btn btn-warning calc-btn w-100 fw-bold" onclick="appendOperator('*')">×</button></div>
      
      <!-- Row 2 -->
      <div class="col-3"><button class="btn btn-light calc-btn w-100" onclick="appendNumber('7')">7</button></div>
      <div class="col-3"><button class="btn btn-light calc-btn w-100" onclick="appendNumber('8')">8</button></div>
      <div class="col-3"><button class="btn btn-light calc-btn w-100" onclick="appendNumber('9')">9</button></div>
      <div class="col-3"><button class="btn btn-warning calc-btn w-100 fw-bold" onclick="appendOperator('-')">-</button></div>
      
      <!-- Row 3 -->
      <div class="col-3"><button class="btn btn-light calc-btn w-100" onclick="appendNumber('4')">4</button></div>
      <div class="col-3"><button class="btn btn-light calc-btn w-100" onclick="appendNumber('5')">5</button></div>
      <div class="col-3"><button class="btn btn-light calc-btn w-100" onclick="appendNumber('6')">6</button></div>
      <div class="col-3"><button class="btn btn-warning calc-btn w-100 fw-bold" onclick="appendOperator('+')">+</button></div>
      
      <!-- Row 4 -->
      <div class="col-3"><button class="btn btn-light calc-btn w-100" onclick="appendNumber('1')">1</button></div>
      <div class="col-3"><button class="btn btn-light calc-btn w-100" onclick="appendNumber('2')">2</button></div>
      <div class="col-3"><button class="btn btn-light calc-btn w-100" onclick="appendNumber('3')">3</button></div>
      <div class="col-3"><button class="btn btn-primary calc-btn w-100 fw-bold" onclick="calculate()">=</button></div>
      
      <!-- Row 5 -->
      <div class="col-6"><button class="btn btn-light calc-btn w-100" onclick="appendNumber('0')">0</button></div>
      <div class="col-6"><button class="btn btn-light calc-btn w-100 fw-bold" onclick="appendNumber('.')">.</button></div>
    </div>
  </div>

  <script>
    const display = document.getElementById("display");
    let currentExpression = "";

    function updateDisplay(value) {
      display.innerText = value || "0";
    }

    function appendNumber(num) {
      currentExpression += num;
      updateDisplay(currentExpression);
    }

    function appendOperator(operator) {
      // Prevent multiple operators in a row
      if (currentExpression === "") return;
      const lastChar = currentExpression.slice(-1);
      if (['+', '-', '*', '/'].includes(lastChar)) {
        currentExpression = currentExpression.slice(0, -1);
      }
      currentExpression += operator;
      updateDisplay(currentExpression);
    }

    function clearDisplay() {
      currentExpression = "";
      updateDisplay("0");
    }

    function calculate() {
      try {
        if (currentExpression === "") return;
        // Using eval is fine for a simple isolated student project calculator
        const result = eval(currentExpression);
        currentExpression = String(result);
        updateDisplay(currentExpression);
      } catch (error) {
        updateDisplay("Error");
        currentExpression = "";
      }
    }
  </script>
</body>
</html>
